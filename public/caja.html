<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Villa Alegre · Caja</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="cup">☕</span> Villa Alegre</div>
    <nav>
      <a href="index.html">Vender</a>
      <a href="inventario.html">Inventario</a>
      <a href="reportes.html">Reportes</a>
      <a href="caja.html" class="active">Caja</a>
      <a href="whatsapp.html">WhatsApp</a>
    </nav>
  </header>

  <div class="container">
    <h2 style="margin-bottom:16px;color:var(--primary-dark);">Caja</h2>

    <div class="card" id="cashCard">
      <div class="card-head">
        <h2 style="margin:0;">Apertura y Cierre de Caja</h2>
        <label class="toggle-label" title="Mostrar u ocultar la caja">
          <input type="checkbox" id="cashToggle" checked>
          <span class="toggle-switch"></span>
          <span class="toggle-text">Activa</span>
        </label>
      </div>
      <div id="cashContent">
        <div id="cashBox" class="muted">Cargando…</div>
      </div>
    </div>

    <div class="card mt" id="turnsCard">
      <div class="card-head">
        <h2 style="margin:0;">Turnos de caja</h2>
        <label class="toggle-label" title="Mostrar u ocultar los turnos de caja">
          <input type="checkbox" id="turnsToggle" checked>
          <span class="toggle-switch"></span>
          <span class="toggle-text">Activa</span>
        </label>
      </div>
      <div id="turnsContent">
        <div class="ps-controls">
          <div class="ps-period">
            <select id="turnsPeriod">
              <option value="all" selected>Todos</option>
              <option value="day">Hoy</option>
              <option value="week">Esta semana</option>
              <option value="month">Este mes</option>
              <option value="custom">Rango personalizado</option>
            </select>
            <div class="ps-dates hidden" id="turnsDates">
              <input type="date" id="turnsFrom">
              <span class="muted">a</span>
              <input type="date" id="turnsTo">
            </div>
            <button class="btn btn-sm btn-success" id="turnsGo">Filtrar</button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Turno</th>
                <th>Cajero</th>
                <th>Apertura</th>
                <th>Cierre</th>
                <th class="num">Ventas</th>
                <th class="num">Ingresos del turno</th>
                <th class="num">Fondo</th>
                <th class="num">Esperado</th>
                <th class="num">Contado</th>
                <th class="num">Diferencia</th>
              </tr>
            </thead>
            <tbody id="turnsBody"></tbody>
            <tfoot id="turnsFoot"></tfoot>
          </table>
        </div>
        <div id="turnsEmpty" class="muted" style="text-align:center;padding:24px;">Aún no hay turnos registrados.</div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/caja.js"></script>
</body>
</html>
